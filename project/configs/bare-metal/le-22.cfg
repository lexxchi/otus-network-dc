
le-22#sh run
! Command: show running-config
! device: le-22 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
alias c configure terminal
alias ii show interfaces descr
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname le-22
!
spanning-tree mode mstp
!
vlan 10,210
!
vrf instance TENANT-DC2
!
interface Ethernet1
   description 2@sp-21
   mtu 8000
   no switchport
   ip address 10.22.1.3/31
   bfd echo
   ip ospf neighbor bfd
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   description 2@sp-22
   mtu 8000
   no switchport
   ip address 10.22.2.3/31
   bfd echo
   ip ospf neighbor bfd
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet3
   description eth0@cl-44
   switchport access vlan 10
!
interface Ethernet4
   shutdown
!
interface Ethernet5
   shutdown
!
interface Ethernet6
   shutdown
!
interface Ethernet7
   shutdown
!
interface Ethernet8
   shutdown
!
interface Loopback0
   ip address 10.0.21.2/32
   ip ospf area 0.0.0.0
!
interface Management1
!
interface Vlan210
   vrf TENANT-DC2
   ip address virtual 192.168.210.1/24
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 210 vni 10210
   vxlan vrf TENANT-DC2 vni 50200
!
ip virtual-router mac-address 00:00:be:ef:dc:02
!
ip routing
ip routing vrf TENANT-DC2
!
router bgp 65200
   router-id 10.0.21.2
   no bgp default ipv4-unicast
   timers bgp 3 9
   maximum-paths 4 ecmp 4
   neighbor DC2-SPINES peer group
   neighbor DC2-SPINES remote-as 65200
   neighbor DC2-SPINES update-source Loopback0
   neighbor DC2-SPINES send-community extended
   neighbor 10.0.21.0 peer group DC2-SPINES
   neighbor 10.0.22.0 peer group DC2-SPINES
   !
   vlan 10
      rd 10.0.21.2:10010
      route-target both 10:10010
      redistribute learned
   !
   vlan 210
      rd 10.0.21.2:10210
      route-target both 210:10210
      redistribute learned
   !
   address-family evpn
      neighbor DC2-SPINES activate
   !
   vrf TENANT-DC2
      rd 10.0.21.2:50200
      route-target import evpn 50200:50200
      route-target export evpn 50200:50200
      redistribute connected
!
router ospf 1
   router-id 10.0.21.2
   max-lsa 12000
   maximum-paths 4
!
end
le-22#