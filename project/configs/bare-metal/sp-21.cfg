
sp-21#sh run
! Command: show running-config
! device: sp-21 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
alias c configure terminal
alias ii show interfaces descr
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname sp-21
!
spanning-tree mode mstp
!
interface Ethernet1
   description 1@le-21
   mtu 8000
   no switchport
   ip address 10.22.1.0/31
   bfd echo
   ip ospf neighbor bfd
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   description 1@le-22
   mtu 8000
   no switchport
   ip address 10.22.1.2/31
   bfd echo
   ip ospf neighbor bfd
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet3
   description 1@le-23
   mtu 8000
   no switchport
   ip address 10.22.1.4/31
   bfd echo
   ip ospf neighbor bfd
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet4
   description 1@bl-21
   mtu 8000
   no switchport
   ip address 10.22.1.6/31
   bfd echo
   ip ospf neighbor bfd
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet5
   shutdown
!
interface Ethernet6
   shutdown
!
interface Ethernet7
   shutdown
!
interface Ethernet8
   shutdown
!
interface Loopback0
   ip address 10.0.21.0/32
   ip ospf area 0.0.0.0
!
interface Management1
!
ip routing
!
router bgp 65200
   router-id 10.0.21.0
   no bgp default ipv4-unicast
   timers bgp 3 9
   maximum-paths 4 ecmp 4
   neighbor DC2-LEAFS peer group
   neighbor DC2-LEAFS remote-as 65200
   neighbor DC2-LEAFS update-source Loopback0
   neighbor DC2-LEAFS route-reflector-client
   neighbor DC2-LEAFS send-community extended
   neighbor 10.0.21.1 peer group DC2-LEAFS
   neighbor 10.0.21.2 peer group DC2-LEAFS
   neighbor 10.0.21.3 peer group DC2-LEAFS
   neighbor 10.0.21.4 peer group DC2-LEAFS
   !
   address-family evpn
      neighbor DC2-LEAFS activate
!
router ospf 1
   router-id 10.0.21.0
   max-lsa 12000
   maximum-paths 4
!
end
sp-21#