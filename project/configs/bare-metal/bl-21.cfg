
bl-21#sh run
! Command: show running-config
! device: bl-21 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
alias c configure terminal
alias ii show interfaces descr
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname bl-21
!
spanning-tree mode mstp
!
vlan 210
!
vrf instance TENANT-DC2
!
interface Ethernet1
   description 4@sp-21
   mtu 8000
   no switchport
   ip address 10.22.1.7/31
   bfd echo
   ip ospf neighbor bfd
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet2
   description 4@sp-22
   mtu 8000
   no switchport
   ip address 10.22.2.7/31
   bfd echo
   ip ospf neighbor bfd
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet3
   description vyos
   shutdown
   switchport access vlan 210
!
interface Ethernet4
   description eth0@cl-dc2-3
   switchport access vlan 210
!
interface Ethernet5
   description DCI@bl-1
   mtu 8000
   no switchport
   ip address 10.255.0.1/31
!
interface Ethernet6
   shutdown
!
interface Ethernet7
   shutdown
!
interface Ethernet8
   shutdown
!
interface Loopback0
   ip address 10.0.21.4/32
   ip ospf area 0.0.0.0
!
interface Management1
!
interface Vlan210
   vrf TENANT-DC2
   ip address virtual 192.168.210.1/24
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 210 vni 10210
   vxlan vrf TENANT-DC2 vni 50200
!
ip virtual-router mac-address 00:00:be:ef:dc:02
!
ip routing
ip routing vrf TENANT-DC2
!
ip prefix-list DC1-VTEP-LOOPBACKS seq 10 permit 10.0.1.0/24 ge 32 le 32
ip prefix-list DC2-VTEP-LOOPBACKS seq 10 permit 10.0.21.0/24 ge 32 le 32
!
route-map EXPORT-DC2-LOOPBACKS permit 10
   match ip address prefix-list DC2-VTEP-LOOPBACKS
!
route-map IMPORT-DC1-LOOPBACKS permit 10
   match ip address prefix-list DC1-VTEP-LOOPBACKS
!
router bgp 65200
   router-id 10.0.21.4
   no bgp default ipv4-unicast
   timers bgp 3 9
   maximum-paths 4 ecmp 4
   neighbor DC2-SPINES peer group
   neighbor DC2-SPINES remote-as 65200
   neighbor DC2-SPINES update-source Loopback0
   neighbor DC2-SPINES send-community extended
   neighbor DCI-EVPN peer group
   neighbor DCI-EVPN remote-as 65104
   neighbor DCI-EVPN update-source Loopback0
   neighbor DCI-EVPN ebgp-multihop 5
   neighbor DCI-EVPN send-community extended
   neighbor DCI-UNDERLAY peer group
   neighbor DCI-UNDERLAY remote-as 65104
   neighbor DCI-UNDERLAY bfd
   neighbor DCI-UNDERLAY send-community extended
   neighbor 10.0.1.4 peer group DCI-EVPN
   neighbor 10.0.21.0 peer group DC2-SPINES
   neighbor 10.0.22.0 peer group DC2-SPINES
   neighbor 10.255.0.0 peer group DCI-UNDERLAY
   !
   vlan 210
      rd 10.0.21.4:10210
      route-target both 210:10210
      redistribute learned
   !
   address-family evpn
      neighbor DC2-SPINES activate
      neighbor DCI-EVPN activate
   !
   address-family ipv4
      neighbor DCI-UNDERLAY activate
      network 10.0.21.4/32
      redistribute ospf route-map EXPORT-DC2-LOOPBACKS
   !
   vrf TENANT-DC2
      rd 10.0.21.4:50200
      route-target import evpn 50200:50200
      route-target export evpn 50200:50200
      redistribute connected
!
router ospf 1
   router-id 10.0.21.4
   redistribute bgp route-map IMPORT-DC1-LOOPBACKS
   max-lsa 12000
   maximum-paths 4
!
end
bl-21#