
bl-1#sh run
! Command: show running-config
! device: bl-1 (vEOS-lab, EOS-4.29.2F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
alias c configure terminal
alias ii show interfaces descr
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname bl-1
!
spanning-tree mode mstp
!
vlan 10,20,30
!
vlan 100
   name TRANSIT_TENANT_1
!
vlan 130
   name TRANSIT_IDRAC
!
vrf instance IDRAC
!
vrf instance TENANT-1
!
interface Ethernet1
   description 4@sp-1
   mtu 8000
   no switchport
   ip address 10.2.1.7/31
!
interface Ethernet2
   description 4@sp-2
   mtu 8000
   no switchport
   ip address 10.2.2.7/31
!
interface Ethernet3
   description eth0@vyos-fw
   switchport trunk allowed vlan 100,130
   switchport mode trunk
!
interface Ethernet4
   description cl-idrac-1
   switchport access vlan 30
!
interface Ethernet5
   shutdown
!
interface Ethernet6
   shutdown
!
interface Ethernet7
   shutdown
!
interface Ethernet8
   shutdown
!
interface Loopback0
   ip address 10.0.1.4/32
!
interface Management1
!
interface Vlan10
   vrf TENANT-1
   ip address virtual 192.168.10.1/24
!
interface Vlan20
   vrf TENANT-1
   ip address virtual 192.168.20.1/24
!
interface Vlan30
   description iDRAC gw
   vrf IDRAC
   ip address 198.51.100.129/25
!
interface Vlan100
   description TRANSIT_TENANT_1
   vrf TENANT-1
   ip address 203.0.113.1/30
!
interface Vlan130
   vrf IDRAC
   ip address 203.0.113.5/30
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vlan 30 vni 10030
   vxlan vrf TENANT-1 vni 50000
!
ip virtual-router mac-address 00:00:be:ef:ca:fe
!
ip routing
ip routing vrf IDRAC
ip routing vrf TENANT-1
!
router bgp 65104
   router-id 10.0.1.4
   no bgp default ipv4-unicast
   timers bgp 3 9
   maximum-paths 4 ecmp 4
   neighbor SPINES-OVERLAY peer group
   neighbor SPINES-OVERLAY remote-as 65001
   neighbor SPINES-OVERLAY update-source Loopback0
   neighbor SPINES-OVERLAY ebgp-multihop 3
   neighbor SPINES-OVERLAY send-community extended
   neighbor SPINES-UNDERLAY peer group
   neighbor SPINES-UNDERLAY remote-as 65001
   neighbor SPINES-UNDERLAY bfd
   neighbor SPINES-UNDERLAY send-community extended
   neighbor 10.0.1.0 peer group SPINES-OVERLAY
   neighbor 10.0.2.0 peer group SPINES-OVERLAY
   neighbor 10.2.1.6 peer group SPINES-UNDERLAY
   neighbor 10.2.2.6 peer group SPINES-UNDERLAY
   !
   vlan 10
      rd 10.0.1.4:10010
      route-target both 10:10010
      redistribute learned
   !
   vlan 20
      rd 10.0.1.4:10020
      route-target both 20:10020
      redistribute learned
   !
   vlan 30
      rd 10.0.1.4:10030
      route-target both 30:10030
      redistribute learned
   !
   address-family evpn
      neighbor SPINES-OVERLAY activate
   !
   address-family ipv4
      neighbor SPINES-UNDERLAY activate
      network 10.0.1.4/32
   !
   vrf IDRAC
      neighbor 203.0.113.6 remote-as 64497
      redistribute connected
      !
      address-family ipv4
         neighbor 203.0.113.6 activate
   !
   vrf TENANT-1
      rd 10.0.1.4:50000
      route-target import evpn 50000:50000
      route-target export evpn 50000:50000
      neighbor 203.0.113.2 remote-as 64497
      redistribute connected
      !
      address-family ipv4
         neighbor 203.0.113.2 activate
!
end
bl-1#